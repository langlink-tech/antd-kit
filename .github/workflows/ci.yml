# Greenfield CI template. Pin actions to full commit SHAs; Dependabot updates them.
# Runtime versions come from the repo .mise.toml (single contract with local mise).

name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install mise tools from .mise.toml
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          install: true

      - name: Install dependencies
        run: mise exec -- pnpm install --frozen-lockfile

      - name: Verify
        run: mise exec -- pnpm verify

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install mise tools from .mise.toml
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          install: true

      - name: Install dependencies
        run: mise exec -- pnpm install --frozen-lockfile

      - name: Build
        run: mise exec -- pnpm build

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '\n//npm.pkg.github.com/:_authToken=%s\n' "${NODE_AUTH_TOKEN}" >> .npmrc
          if mise exec -- pnpm view @langlink-tech/antd-kit@0.1.0 version >/dev/null 2>&1; then
            echo "0.1.0 already published"
            exit 0
          fi
          mise exec -- pnpm publish --no-git-checks

  grant-package-access:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Grant consumer repositories package read
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for repo in ll-lqa-test plunet-api-server public-mailbox-feishu-cloudflare langlink-lqa-tapd langlink-tools plunet-chrome-plugin langlink-tech-portal; do
            echo "grant read: ${repo}"
            gh api --method PUT \
              "orgs/langlink-tech/packages/npm/%40langlink-tech%2Fantd-kit/repositories/${repo}" \
              || echo "grant skipped for ${repo}"
          done
