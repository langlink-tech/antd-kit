# Greenfield CI template. Pin actions to full commit SHAs; Dependabot updates them.
# Runtime versions come from the repo .mise.toml (single contract with local mise).

name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install mise tools from .mise.toml
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          install: true

      - name: Install dependencies
        run: mise exec -- pnpm install --frozen-lockfile

      - name: Verify
        run: mise exec -- pnpm verify

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install mise tools from .mise.toml
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          install: true

      - name: Install dependencies
        run: mise exec -- pnpm install --frozen-lockfile

      - name: Build
        run: mise exec -- pnpm build

      - name: Publish to GitHub Packages
        id: publish_pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          printf '\n//npm.pkg.github.com/:_authToken=%s\n' "${NODE_AUTH_TOKEN}" >> .npmrc
          if mise exec -- pnpm view "@langlink-tech/antd-kit@${VERSION}" version >/dev/null 2>&1; then
            echo "${VERSION} already published"
          else
            mise exec -- pnpm publish --no-git-checks
          fi
          FOUND="$(mise exec -- pnpm view "@langlink-tech/antd-kit@${VERSION}" version)"
          test "${FOUND}" = "${VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

  consume-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install mise tools from .mise.toml
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          install: true

      - name: Install and roll back from GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          WORK="$(mktemp -d)"
          STORE="$(mktemp -d)"
          printf '@langlink-tech:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "${NODE_AUTH_TOKEN}" > "${WORK}/.npmrc"
          printf '{"name":"antd-kit-consume-smoke","private":true,"type":"module"}\n' > "${WORK}/package.json"
          mise exec -- pnpm --dir "${WORK}" --store-dir "${STORE}" add "@langlink-tech/antd-kit@${VERSION}"
          (
            cd "${WORK}"
            node --input-type=module -e "import { getServerReducedMotionSnapshot } from '@langlink-tech/antd-kit/motion'; if (getServerReducedMotionSnapshot() !== true) { process.exit(1); }"
          )
          mise exec -- pnpm --dir "${WORK}" --store-dir "${STORE}" remove "@langlink-tech/antd-kit"
          if (cd "${WORK}" && node --input-type=module -e "import '@langlink-tech/antd-kit/motion'"); then
            echo "::error::import succeeded after remove"
            exit 1
          fi

  grant-package-access:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Grant consumer repositories package read
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PACKAGE_PATH="orgs/langlink-tech/packages/npm/%40langlink-tech%2Fantd-kit"
          gh api "${PACKAGE_PATH}" --jq .name
          gh api --method PUT "${PACKAGE_PATH}/actions/permissions" -f access=selected
          failed=0
          # Numeric IDs only: GITHUB_TOKEN cannot GET sibling repos.
          for pair in \
            ll-lqa-test:1177095833 \
            plunet-api-server:1044635925 \
            public-mailbox-feishu-cloudflare:1213796511 \
            langlink-lqa-tapd:1267473801 \
            langlink-tools:575714131 \
            plunet-chrome-plugin:1191824845 \
            langlink-tech-portal:1217703807
          do
            name="${pair%%:*}"
            id="${pair##*:}"
            echo "grant read: ${name} (${id})"
            if ! gh api --method PUT "${PACKAGE_PATH}/actions/permissions/repositories/${id}"; then
              echo "::error::grant failed for ${name}"
              failed=1
            fi
          done
          exit "${failed}"
