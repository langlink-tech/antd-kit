# Greenfield CI template. Pin actions to full commit SHAs; Dependabot updates them.
# Runtime versions come from the repo .mise.toml (single contract with local mise).

name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install mise tools from .mise.toml
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true

      - name: Install dependencies
        run: mise exec -- pnpm install --frozen-lockfile

      - name: Verify
        run: mise exec -- pnpm verify

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mise tools from .mise.toml
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true

      - name: Install dependencies
        run: mise exec -- pnpm install --frozen-lockfile

      - name: Build
        run: mise exec -- pnpm build

      - name: Publish to GitHub Packages
        id: publish_pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          printf '@langlink-tech:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "${NODE_AUTH_TOKEN}" > "${HOME}/.npmrc"
          mise exec -- node scripts/assert-publish.mjs
          FOUND="$(mise exec -- pnpm view "@langlink-tech/antd-kit@${VERSION}" version)"
          test "${FOUND}" = "${VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

  consume-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mise tools from .mise.toml
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true

      - name: Install and uninstall published package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          WORK="$(mktemp -d)"
          STORE="$(mktemp -d)"
          printf '@langlink-tech:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "${NODE_AUTH_TOKEN}" > "${HOME}/.npmrc"
          printf '{"name":"antd-kit-consume-smoke","private":true,"type":"module"}\n' > "${WORK}/package.json"
          printf 'minimumReleaseAge: 10080\nminimumReleaseAgeExclude:\n  - "@langlink-tech/antd-kit"\n' > "${WORK}/pnpm-workspace.yaml"
          mise exec -- pnpm --dir "${WORK}" --store-dir "${STORE}" add "@langlink-tech/antd-kit@${VERSION}"
          (
            cd "${WORK}"
            node --input-type=module -e "
              import { getServerReducedMotionSnapshot } from '@langlink-tech/antd-kit/motion';
              import '@langlink-tech/antd-kit/table';
              import '@langlink-tech/antd-kit/form';
              import '@langlink-tech/antd-kit/dashboard';
              import '@langlink-tech/antd-kit/navigation';
              import '@langlink-tech/antd-kit/feedback';
              import '@langlink-tech/antd-kit/overlay';
              if (getServerReducedMotionSnapshot() !== true) process.exit(1);
            "
          )
          mise exec -- pnpm --dir "${WORK}" --store-dir "${STORE}" remove "@langlink-tech/antd-kit"
          if (cd "${WORK}" && node --input-type=module -e "import '@langlink-tech/antd-kit/motion'"); then
            echo "::error::import succeeded after remove"
            exit 1
          fi
